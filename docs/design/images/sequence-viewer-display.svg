<svg viewBox="0 0 1580 1270" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>ビューア画面表示のシーケンス(S03 → S04)</title>
<desc>ユーザー、GUIX入力イベントスレッド、GUIXシステムスレッド、共有データ(RAM、TX_MUTEXで保護)、データ管理スレッド、FileX、Windowsファイルシステムの7本のライフラインの間で、ファイル選択からGX_EVENTの送信、データ管理スレッドへのファイル読み込み指示(TX_QUEUE)、FileXのfx_file_open・fx_file_read・fx_file_close呼び出し、fx_win32_file_driverを介したWindowsファイルシステムからの実読み込み、共有データへのTX_MUTEXロック書き込み、GUIXシステムスレッドのGX_EVENT_TIMERによる共有データへのTX_MUTEXロック読み込み、同期的なPNGデコード、画面遷移、画面更新までのメッセージのやり取りを示す。</desc>
<style>
  .actor-box { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
  .actor-box-ext { fill: var(--box-fill-ext); stroke: var(--box-stroke); stroke-width: 1.5; }
  .actor-box-mem { fill: var(--box-fill-mem); stroke: var(--box-stroke); stroke-width: 1.5; }
  .actor-text { font-size: 13px; font-weight: 700; fill: var(--text-main); text-anchor: middle; }
  .lifeline { stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .msg { stroke: var(--arrow-color); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .msg-return { stroke: var(--arrow-color); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
  .msg-label { font-size: 11.5px; fill: var(--text-main); }
  .self-tick { fill: var(--tick-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
  .self-tick-file { fill: var(--tick-fill-file); stroke: var(--box-stroke); stroke-width: 1.5; }
  .section-title { font-size: 14px; font-weight: 700; fill: var(--text-main); }
  .mutex-span { fill: var(--mutex-fill); stroke: var(--mutex-color); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .mutex-label { font-size: 10.5px; font-weight: 700; fill: var(--mutex-color); }
  :root {
    --bg: #ffffff; --text-main: #1a1a1a;
    --box-fill: #eef2ff; --box-fill-ext: #f3f4f6; --box-fill-mem: #fee2e2; --box-stroke: #333333;
    --tick-fill: #fef3c7; --tick-fill-file: #dbeafe;
    --arrow-color: #4c1d95; --mutex-color: #b91c1c; --mutex-fill: rgba(185,28,28,0.06);
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --text-main: #e8e8e8;
    --box-fill: #2d3250; --box-fill-ext: #383838; --box-fill-mem: #5b1f1f; --box-stroke: #8ab4f8;
    --tick-fill: #78350f; --tick-fill-file: #1e3a5f;
    --arrow-color: #c4b5fd; --mutex-color: #f87171; --mutex-fill: rgba(248,113,113,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1e1e; --text-main: #e8e8e8;
      --box-fill: #2d3250; --box-fill-ext: #383838; --box-fill-mem: #5b1f1f; --box-stroke: #8ab4f8;
      --tick-fill: #78350f; --tick-fill-file: #1e3a5f;
      --arrow-color: #c4b5fd; --mutex-color: #f87171; --mutex-fill: rgba(248,113,113,0.10);
    }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow-color)"/>
  </marker>
</defs>

<rect x="0" y="0" width="1580" height="1270" fill="var(--bg)"/>

<!-- Actor headers -->
<rect class="actor-box" x="20" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="90" y="41">ユーザー</text>

<rect class="actor-box" x="250" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="320" y="34">GUIX入力<tspan x="320" dy="14">イベントスレッド</tspan></text>

<rect class="actor-box" x="480" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="550" y="34">GUIXシステム<tspan x="550" dy="14">スレッド</tspan></text>

<rect class="actor-box-mem" x="710" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="780" y="34">共有データ<tspan x="780" dy="14">(RAM)</tspan></text>

<rect class="actor-box" x="940" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="1010" y="34">データ管理<tspan x="1010" dy="14">スレッド</tspan></text>

<rect class="actor-box-ext" x="1170" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="1240" y="41">FileX</text>

<rect class="actor-box-ext" x="1400" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="1470" y="34">Windows<tspan x="1470" dy="14">ファイルシステム</tspan></text>

<!-- Lifelines -->
<line class="lifeline" x1="90" y1="70" x2="90" y2="1175"/>
<line class="lifeline" x1="320" y1="70" x2="320" y2="1175"/>
<line class="lifeline" x1="550" y1="70" x2="550" y2="1175"/>
<line class="lifeline" x1="780" y1="70" x2="780" y2="1175"/>
<line class="lifeline" x1="1010" y1="70" x2="1010" y2="1175"/>
<line class="lifeline" x1="1240" y1="70" x2="1240" y2="1175"/>
<line class="lifeline" x1="1470" y1="70" x2="1470" y2="1175"/>

<!-- Title -->
<rect x="5" y="75" width="230" height="22" fill="var(--bg)"/>
<text class="section-title" x="10" y="90">S03 → S04 表示(ビューアモード)</text>

<!-- 1: user -> input -->
<line class="msg" x1="90" y1="110" x2="320" y2="110"/>
<text class="msg-label" x="95" y="105">① 1枚選択して「次へ」をタッチ</text>

<!-- 2: input -> system -->
<line class="msg" x1="320" y1="150" x2="550" y2="150"/>
<text class="msg-label" x="325" y="145">② GX_EVENTをキューに送る</text>

<!-- 3: self-processing (system) -->
<rect class="self-tick" x="543" y="180" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="190">③ イベントを処理し</text>
<text class="msg-label" x="565" y="204">　S03のハンドラを呼ぶ</text>

<!-- 4: system -> data (passes over 共有データ lifeline, unrelated at this point) -->
<line class="msg" x1="550" y1="240" x2="1010" y2="240"/>
<text class="msg-label" x="575" y="235">④ TX_QUEUEで読み込み指示(ファイルパス)</text>

<!-- 5: data -> FileX (open) -->
<line class="msg" x1="1010" y1="280" x2="1240" y2="280"/>
<text class="msg-label" x="1015" y="275">⑤ fx_file_open(&amp;file, path, FX_OPEN_FOR_READ)</text>

<!-- 6: self-processing (FileX) -->
<rect class="self-tick-file" x="1233" y="310" width="14" height="30" rx="3"/>
<text class="msg-label" x="1255" y="329">⑥ ファイルを開く</text>

<!-- 7: FileX -> data (return) -->
<line class="msg-return" x1="1240" y1="370" x2="1010" y2="370"/>
<text class="msg-label" x="1015" y="365">⑦ オープン結果(status)を返す</text>

<!-- 8: data -> FileX (read) -->
<line class="msg" x1="1010" y1="410" x2="1240" y2="410"/>
<text class="msg-label" x="1015" y="405">⑧ fx_file_read(&amp;file, buf, size, &amp;actual)</text>

<!-- 9: FileX -> Windowsファイルシステム -->
<line class="msg" x1="1240" y1="455" x2="1470" y2="455"/>
<text class="msg-label" x="1245" y="450">⑨ 実ファイルを読み込む</text>
<text class="msg-label" x="1245" y="465">　(fx_win32_file_driver経由)</text>

<!-- 10: Windowsファイルシステム -> FileX (return) -->
<line class="msg-return" x1="1470" y1="500" x2="1240" y2="500"/>
<text class="msg-label" x="1245" y="495">⑩ ファイルデータを返す</text>

<!-- 11: FileX -> data (return) -->
<line class="msg-return" x1="1240" y1="540" x2="1010" y2="540"/>
<text class="msg-label" x="1015" y="535">⑪ 読み込んだデータを返す</text>

<!-- 12: data -> FileX (close) -->
<line class="msg" x1="1010" y1="580" x2="1240" y2="580"/>
<text class="msg-label" x="1015" y="575">⑫ fx_file_close(&amp;file)</text>

<!-- 13: self-processing (FileX) -->
<rect class="self-tick-file" x="1233" y="610" width="14" height="30" rx="3"/>
<text class="msg-label" x="1255" y="629">⑬ ファイルを閉じる</text>

<!-- 14: FileX -> data (return) -->
<line class="msg-return" x1="1240" y1="670" x2="1010" y2="670"/>
<text class="msg-label" x="1015" y="665">⑭ クローズ結果を返す</text>

<!-- mutex-protected span: write (data <-> 共有データ) -->
<rect class="mutex-span" x="765" y="685" width="260" height="120" rx="6"/>
<text class="mutex-label" x="775" y="705">TX_MUTEXロック区間</text>

<!-- 15: data -> 共有データ (write, mutex locked) -->
<line class="msg" x1="1010" y1="745" x2="780" y2="745"/>
<text class="msg-label" x="805" y="740">⑮ 結果を書き込む</text>
<text class="msg-label" x="805" y="755">　set_image(OP_SUCCESS, data, size)を呼ぶ</text>

<!-- 16: 共有データ -> data (return) -->
<line class="msg-return" x1="780" y1="790" x2="1010" y2="790"/>
<text class="msg-label" x="805" y="785">⑯ 書き込み完了</text>

<!-- 17: self-processing (system) — timer fires, NOT part of the mutex-locked region -->
<rect class="self-tick" x="543" y="830" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="849">⑰ GX_EVENT_TIMER発火</text>

<!-- mutex-protected span: read (system <-> 共有データ) -->
<rect class="mutex-span" x="535" y="880" width="260" height="120" rx="6"/>
<text class="mutex-label" x="545" y="900">TX_MUTEXロック区間</text>

<!-- 18: system -> 共有データ (read, mutex locked) -->
<line class="msg" x1="550" y1="940" x2="780" y2="940"/>
<text class="msg-label" x="555" y="935">⑱ 共有データを確認</text>
<text class="msg-label" x="555" y="950">　get_image(&amp;out, buf, cap)を呼ぶ</text>

<!-- 19: 共有データ -> system (return) -->
<line class="msg-return" x1="780" y1="985" x2="550" y2="985"/>
<text class="msg-label" x="555" y="980">⑲ bufへmemcpyして返す</text>

<!-- 20: self-processing (system) -->
<rect class="self-tick" x="543" y="1030" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="1040">⑳ gx_image_reader_startで</text>
<text class="msg-label" x="565" y="1054">　PNGデコード(同期・GUIX全体停止)</text>

<!-- 21: self-processing (system) -->
<line class="lifeline" x1="550" y1="1060" x2="550" y2="1075" stroke-dasharray="none"/>
<rect class="self-tick" x="543" y="1075" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="1085">㉑ push(&amp;S03)→attach(root,&amp;S04)</text>
<text class="msg-label" x="565" y="1099">　デコード画像をウィジェットにセット</text>

<!-- 22: system -> user (return) -->
<line class="msg-return" x1="550" y1="1145" x2="90" y2="1145"/>
<text class="msg-label" x="95" y="1135">㉒ 画面が更新される</text>
<text class="msg-label" x="95" y="1160">　(S04+デコードした画像が表示)</text>

<!-- Legend -->
<line x1="20" y1="1177" x2="1560" y2="1177" stroke="var(--box-stroke)" stroke-width="1" stroke-dasharray="3 3"/>

<rect class="actor-box" x="20" y="1190" width="18" height="14" rx="3"/>
<text class="mutex-label" x="44" y="1202" fill="var(--text-main)" font-weight="400">スレッド</text>

<rect class="actor-box-ext" x="180" y="1190" width="18" height="14" rx="3"/>
<text class="mutex-label" x="204" y="1202" fill="var(--text-main)" font-weight="400">外部ライブラリ/OS</text>

<rect class="actor-box-mem" x="340" y="1190" width="18" height="14" rx="3"/>
<text class="mutex-label" x="364" y="1202" fill="var(--text-main)" font-weight="400">共有データ</text>

<rect class="self-tick" x="20" y="1225" width="18" height="14" rx="3"/>
<text class="mutex-label" x="44" y="1237" fill="var(--text-main)" font-weight="400">システム処理</text>

<rect class="self-tick-file" x="180" y="1225" width="18" height="14" rx="3"/>
<text class="mutex-label" x="204" y="1237" fill="var(--text-main)" font-weight="400">FileX処理</text>

<rect class="mutex-span" x="340" y="1225" width="18" height="14" rx="3"/>
<text class="mutex-label" x="364" y="1237">ロック区間</text>

</svg>
