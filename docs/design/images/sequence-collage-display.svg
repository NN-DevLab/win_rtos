<svg viewBox="0 0 1150 920" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>コラージュ画面表示のシーケンス(S03 → S05)</title>
<desc>ユーザー、GUIX入力イベントスレッド、GUIXシステムスレッド、共有データ(RAM、TX_MUTEXで保護)、データ管理スレッドの5本のライフラインの間で、コラージュモードで2枚選択して「次へ」を押してから、選択した2枚それぞれについて、データ管理スレッドへの読み込み指示(TX_QUEUE)、FileXでの読み込み(詳細はビューア表示のシーケンス図を参照)、共有データへのTX_MUTEXロック書き込み/読み込み、GUIXシステムスレッドでの同期的なPNGデコードと該当スロット(左/右)への画像セットを繰り返すループ、その後の画面遷移、画面更新までのメッセージのやり取りを示す。</desc>
<style>
  .actor-box { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
  .actor-box-mem { fill: var(--box-fill-mem); stroke: var(--box-stroke); stroke-width: 1.5; }
  .actor-text { font-size: 13px; font-weight: 700; fill: var(--text-main); text-anchor: middle; }
  .lifeline { stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .msg { stroke: var(--arrow-color); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .msg-return { stroke: var(--arrow-color); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
  .msg-label { font-size: 11.5px; fill: var(--text-main); }
  .self-tick { fill: var(--tick-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
  .self-tick-data { fill: var(--tick-fill-data); stroke: var(--box-stroke); stroke-width: 1.5; }
  .section-title { font-size: 14px; font-weight: 700; fill: var(--text-main); }
  .mutex-span { fill: var(--mutex-fill); stroke: var(--mutex-color); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .mutex-label { font-size: 10.5px; font-weight: 700; fill: var(--mutex-color); }
  .loop-span { fill: var(--loop-fill); stroke: var(--loop-color); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .loop-label { font-size: 10.5px; font-weight: 700; fill: var(--loop-color); }
  :root {
    --bg: #ffffff; --text-main: #1a1a1a;
    --box-fill: #eef2ff; --box-fill-mem: #fee2e2; --box-stroke: #333333;
    --tick-fill: #fef3c7; --tick-fill-data: #dcfce7;
    --arrow-color: #4c1d95; --mutex-color: #b91c1c; --mutex-fill: rgba(185,28,28,0.06);
    --loop-color: #1d4ed8; --loop-fill: rgba(29,78,216,0.05);
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --text-main: #e8e8e8;
    --box-fill: #2d3250; --box-fill-mem: #5b1f1f; --box-stroke: #8ab4f8;
    --tick-fill: #78350f; --tick-fill-data: #14532d;
    --arrow-color: #c4b5fd; --mutex-color: #f87171; --mutex-fill: rgba(248,113,113,0.10);
    --loop-color: #60a5fa; --loop-fill: rgba(96,165,250,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1e1e; --text-main: #e8e8e8;
      --box-fill: #2d3250; --box-fill-mem: #5b1f1f; --box-stroke: #8ab4f8;
      --tick-fill: #78350f; --tick-fill-data: #14532d;
      --arrow-color: #c4b5fd; --mutex-color: #f87171; --mutex-fill: rgba(248,113,113,0.10);
      --loop-color: #60a5fa; --loop-fill: rgba(96,165,250,0.08);
    }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow-color)"/>
  </marker>
</defs>

<rect x="0" y="0" width="1150" height="920" fill="var(--bg)"/>

<!-- Actor headers -->
<rect class="actor-box" x="20" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="90" y="41">ユーザー</text>

<rect class="actor-box" x="250" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="320" y="34">GUIX入力<tspan x="320" dy="14">イベントスレッド</tspan></text>

<rect class="actor-box" x="480" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="550" y="34">GUIXシステム<tspan x="550" dy="14">スレッド</tspan></text>

<rect class="actor-box-mem" x="710" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="780" y="34">共有データ<tspan x="780" dy="14">(RAM)</tspan></text>

<rect class="actor-box" x="940" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="1010" y="34">データ管理<tspan x="1010" dy="14">スレッド</tspan></text>

<!-- Lifelines -->
<line class="lifeline" x1="90" y1="70" x2="90" y2="900"/>
<line class="lifeline" x1="320" y1="70" x2="320" y2="900"/>
<line class="lifeline" x1="550" y1="70" x2="550" y2="900"/>
<line class="lifeline" x1="780" y1="70" x2="780" y2="900"/>
<line class="lifeline" x1="1010" y1="70" x2="1010" y2="900"/>

<!-- Title -->
<rect x="5" y="75" width="230" height="22" fill="var(--bg)"/>
<text class="section-title" x="10" y="90">S03 → S05 表示(コラージュモード)</text>

<!-- 1: user -> input -->
<line class="msg" x1="90" y1="110" x2="320" y2="110"/>
<text class="msg-label" x="95" y="105">① 2枚選択して「次へ」をタッチ</text>

<!-- 2: input -> system -->
<line class="msg" x1="320" y1="150" x2="550" y2="150"/>
<text class="msg-label" x="325" y="145">② GX_EVENTをキューに送る</text>

<!-- 3: self-processing (system) -->
<rect class="self-tick" x="543" y="180" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="190">③ イベントを処理し</text>
<text class="msg-label" x="565" y="204">　S03のハンドラを呼ぶ</text>

<!-- Loop: repeat for each of the 2 selected files -->
<rect class="loop-span" x="510" y="225" width="590" height="545" rx="6"/>
<text class="loop-label" x="520" y="245">loop: 選択した2枚それぞれについて繰り返す(左スロット/右スロット)</text>

<!-- 4: system -> data -->
<line class="msg" x1="550" y1="280" x2="1010" y2="280"/>
<text class="msg-label" x="575" y="275">④ TX_QUEUEで読み込み指示(ファイルパス、格納先スロット)</text>

<!-- 5: self-processing (data) -->
<rect class="self-tick-data" x="1003" y="310" width="14" height="30" rx="3"/>
<text class="msg-label" x="1025" y="320">⑤ FileXでファイルを読み込む</text>
<text class="msg-label" x="1025" y="334">　(open→read→close、詳細はビューア表示参照)</text>

<!-- mutex-protected span: write (data <-> 共有データ) -->
<rect class="mutex-span" x="765" y="355" width="260" height="110" rx="6"/>
<text class="mutex-label" x="775" y="375">TX_MUTEXロック区間</text>

<!-- 6: data -> 共有データ (write, mutex locked) -->
<line class="msg" x1="1010" y1="415" x2="780" y2="415"/>
<text class="msg-label" x="805" y="410">⑥ set_image(OP_SUCCESS, data, size)を呼ぶ</text>

<!-- 7: 共有データ -> data (return) -->
<line class="msg-return" x1="780" y1="450" x2="1010" y2="450"/>
<text class="msg-label" x="805" y="445">⑦ 書き込み完了</text>

<!-- 8: self-processing (system) — timer fires, NOT part of the mutex-locked region -->
<rect class="self-tick" x="543" y="490" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="509">⑧ GX_EVENT_TIMER発火</text>

<!-- mutex-protected span: read (system <-> 共有データ) -->
<rect class="mutex-span" x="535" y="540" width="260" height="110" rx="6"/>
<text class="mutex-label" x="545" y="560">TX_MUTEXロック区間</text>

<!-- 9: system -> 共有データ (read, mutex locked) -->
<line class="msg" x1="550" y1="595" x2="780" y2="595"/>
<text class="msg-label" x="555" y="590">⑨ get_image(&amp;out, buf, cap)を呼ぶ</text>

<!-- 10: 共有データ -> system (return) -->
<line class="msg-return" x1="780" y1="635" x2="550" y2="635"/>
<text class="msg-label" x="555" y="630">⑩ 結果を返す</text>

<!-- 11: self-processing (system) -->
<rect class="self-tick" x="543" y="680" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="699">⑪ gx_image_reader_startでPNGデコード</text>

<!-- 12: self-processing (system) -->
<line class="lifeline" x1="550" y1="710" x2="550" y2="725" stroke-dasharray="none"/>
<rect class="self-tick" x="543" y="725" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="744">⑫ デコードした画像を該当スロットにセット(左/右)</text>

<!-- 13: self-processing (system) -->
<rect class="self-tick" x="543" y="800" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="819">⑬ push(&amp;S03)→attach(root,&amp;S05)で画面遷移</text>

<!-- 14: system -> user (return) -->
<line class="msg-return" x1="550" y1="870" x2="90" y2="870"/>
<text class="msg-label" x="95" y="860">⑭ 画面が更新される</text>
<text class="msg-label" x="95" y="885">　(S05に2枚が横並びで表示される)</text>

</svg>
