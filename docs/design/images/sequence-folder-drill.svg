<svg viewBox="0 0 1580 940" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>フォルダを掘るシーケンス(S02)</title>
<desc>ユーザー、GUIX入力イベントスレッド、GUIXシステムスレッド、共有データ(RAM、TX_MUTEXで保護)、FTP探索スレッド、NetX Duo、同一LAN内の機器の7本のライフラインの間で、フォルダ一覧表示中にフォルダをタッチしてから、GX_EVENTの送信、FTP探索スレッドへのフォルダ一覧取得指示(TX_QUEUE)、既に接続済みのFTPセッション上でnx_ftp_client_directory_listing_getを呼びLISTコマンドで中身を取得、共有データへのTX_MUTEXロック書き込み、GUIXシステムスレッドのGX_EVENT_TIMERによる共有データへのTX_MUTEXロック読み込み、フォルダ一覧の表示更新までのメッセージのやり取りを示す。接続処理(nx_ftp_client_connect)は接続時(D06)に済んでいるため、ここでは行わない。</desc>
<style>
  .actor-box { fill: var(--box-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
  .actor-box-ext { fill: var(--box-fill-ext); stroke: var(--box-stroke); stroke-width: 1.5; }
  .actor-box-mem { fill: var(--box-fill-mem); stroke: var(--box-stroke); stroke-width: 1.5; }
  .actor-text { font-size: 13px; font-weight: 700; fill: var(--text-main); text-anchor: middle; }
  .lifeline { stroke: var(--box-stroke); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .msg { stroke: var(--arrow-color); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .msg-return { stroke: var(--arrow-color); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrow); }
  .msg-label { font-size: 11.5px; fill: var(--text-main); }
  .self-tick { fill: var(--tick-fill); stroke: var(--box-stroke); stroke-width: 1.5; }
  .self-tick-net { fill: var(--tick-fill-net); stroke: var(--box-stroke); stroke-width: 1.5; }
  .section-title { font-size: 14px; font-weight: 700; fill: var(--text-main); }
  .mutex-span { fill: var(--mutex-fill); stroke: var(--mutex-color); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .mutex-label { font-size: 10.5px; font-weight: 700; fill: var(--mutex-color); }
  :root {
    --bg: #ffffff; --text-main: #1a1a1a;
    --box-fill: #eef2ff; --box-fill-ext: #f3f4f6; --box-fill-mem: #fee2e2; --box-stroke: #333333;
    --tick-fill: #fef3c7; --tick-fill-net: #dbeafe;
    --arrow-color: #4c1d95; --mutex-color: #b91c1c; --mutex-fill: rgba(185,28,28,0.06);
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --text-main: #e8e8e8;
    --box-fill: #2d3250; --box-fill-ext: #383838; --box-fill-mem: #5b1f1f; --box-stroke: #8ab4f8;
    --tick-fill: #78350f; --tick-fill-net: #1e3a5f;
    --arrow-color: #c4b5fd; --mutex-color: #f87171; --mutex-fill: rgba(248,113,113,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1e1e; --text-main: #e8e8e8;
      --box-fill: #2d3250; --box-fill-ext: #383838; --box-fill-mem: #5b1f1f; --box-stroke: #8ab4f8;
      --tick-fill: #78350f; --tick-fill-net: #1e3a5f;
      --arrow-color: #c4b5fd; --mutex-color: #f87171; --mutex-fill: rgba(248,113,113,0.10);
    }
  }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow-color)"/>
  </marker>
</defs>

<rect x="0" y="0" width="1580" height="940" fill="var(--bg)"/>

<!-- Actor headers -->
<rect class="actor-box" x="20" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="90" y="41">ユーザー</text>

<rect class="actor-box" x="250" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="320" y="34">GUIX入力<tspan x="320" dy="14">イベントスレッド</tspan></text>

<rect class="actor-box" x="480" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="550" y="34">GUIXシステム<tspan x="550" dy="14">スレッド</tspan></text>

<rect class="actor-box-mem" x="710" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="780" y="34">共有データ<tspan x="780" dy="14">(RAM)</tspan></text>

<rect class="actor-box" x="940" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="1010" y="34">FTP探索<tspan x="1010" dy="14">スレッド</tspan></text>

<rect class="actor-box-ext" x="1170" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="1240" y="41">NetX Duo</text>

<rect class="actor-box-ext" x="1400" y="15" width="140" height="44" rx="6"/>
<text class="actor-text" x="1470" y="34">同一LAN内<tspan x="1470" dy="14">の機器</tspan></text>

<!-- Lifelines -->
<line class="lifeline" x1="90" y1="70" x2="90" y2="840"/>
<line class="lifeline" x1="320" y1="70" x2="320" y2="840"/>
<line class="lifeline" x1="550" y1="70" x2="550" y2="840"/>
<line class="lifeline" x1="780" y1="70" x2="780" y2="840"/>
<line class="lifeline" x1="1010" y1="70" x2="1010" y2="840"/>
<line class="lifeline" x1="1240" y1="70" x2="1240" y2="840"/>
<line class="lifeline" x1="1470" y1="70" x2="1470" y2="840"/>

<!-- Title -->
<rect x="5" y="75" width="180" height="22" fill="var(--bg)"/>
<text class="section-title" x="10" y="90">S02 フォルダを掘る</text>

<!-- 1: user -> input -->
<line class="msg" x1="90" y1="110" x2="320" y2="110"/>
<text class="msg-label" x="95" y="105">① フォルダをタッチ(フォルダ一覧表示中)</text>

<!-- 2: input -> system -->
<line class="msg" x1="320" y1="150" x2="550" y2="150"/>
<text class="msg-label" x="325" y="145">② GX_EVENTをキューに送る</text>

<!-- 3: self-processing (system) -->
<rect class="self-tick" x="543" y="180" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="190">③ イベントを処理し</text>
<text class="msg-label" x="565" y="204">　タッチされたフォルダのパスを特定</text>

<!-- 4: system -> FTP探索スレッド -->
<line class="msg" x1="550" y1="240" x2="1010" y2="240"/>
<text class="msg-label" x="575" y="235">④ TX_QUEUEでフォルダ一覧取得指示(パス)</text>

<!-- 5: FTP探索スレッド -> NetX Duo (listing) -->
<line class="msg" x1="1010" y1="280" x2="1240" y2="280"/>
<text class="msg-label" x="1015" y="275">⑤ nx_ftp_client_directory_listing_get(path, ...)を呼ぶ</text>

<!-- 6: NetX Duo -> 同一LAN内の機器 -->
<line class="msg" x1="1240" y1="320" x2="1470" y2="320"/>
<text class="msg-label" x="1245" y="315">⑥ LISTコマンド(FTP)</text>

<!-- 7: 同一LAN内の機器 -> NetX Duo (return) -->
<line class="msg-return" x1="1470" y1="360" x2="1240" y2="360"/>
<text class="msg-label" x="1245" y="355">⑦ フォルダの中身を返す</text>

<!-- 8: NetX Duo -> FTP探索スレッド (return) -->
<line class="msg-return" x1="1240" y1="400" x2="1010" y2="400"/>
<text class="msg-label" x="1015" y="395">⑧ 一覧結果を返す</text>

<!-- mutex-protected span: write (FTP探索スレッド <-> 共有データ) -->
<rect class="mutex-span" x="765" y="415" width="260" height="110" rx="6"/>
<text class="mutex-label" x="775" y="435">TX_MUTEXロック区間</text>

<!-- 9: FTP探索スレッド -> 共有データ (write, mutex locked) -->
<line class="msg" x1="1010" y1="475" x2="780" y2="475"/>
<text class="msg-label" x="805" y="470">⑨ set_connection_status(...)を呼ぶ</text>

<!-- 10: 共有データ -> FTP探索スレッド (return) -->
<line class="msg-return" x1="780" y1="510" x2="1010" y2="510"/>
<text class="msg-label" x="805" y="505">⑩ 書き込み完了</text>

<!-- 11: self-processing (system) — timer fires, NOT part of the mutex-locked region -->
<rect class="self-tick" x="543" y="550" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="569">⑪ GX_EVENT_TIMER発火</text>

<!-- mutex-protected span: read (system <-> 共有データ) -->
<rect class="mutex-span" x="535" y="600" width="260" height="110" rx="6"/>
<text class="mutex-label" x="545" y="620">TX_MUTEXロック区間</text>

<!-- 12: system -> 共有データ (read, mutex locked) -->
<line class="msg" x1="550" y1="655" x2="780" y2="655"/>
<text class="msg-label" x="555" y="650">⑫ get_connection_status(&amp;out)を呼ぶ</text>

<!-- 13: 共有データ -> system (return) -->
<line class="msg-return" x1="780" y1="695" x2="550" y2="695"/>
<text class="msg-label" x="555" y="690">⑬ 結果を返す</text>

<!-- 14: self-processing (system) -->
<rect class="self-tick" x="543" y="740" width="14" height="30" rx="3"/>
<text class="msg-label" x="565" y="759">⑭ フォルダ一覧の表示を更新</text>

<!-- 15: system -> user (return) -->
<line class="msg-return" x1="550" y1="810" x2="90" y2="810"/>
<text class="msg-label" x="95" y="800">⑮ 画面が更新される</text>
<text class="msg-label" x="95" y="825">　(新しいフォルダの中身が表示される)</text>

<!-- Legend -->
<line x1="20" y1="842" x2="1560" y2="842" stroke="var(--box-stroke)" stroke-width="1" stroke-dasharray="3 3"/>

<rect class="actor-box" x="20" y="855" width="18" height="14" rx="3"/>
<text class="mutex-label" x="44" y="867" fill="var(--text-main)" font-weight="400">スレッド</text>

<rect class="actor-box-ext" x="180" y="855" width="18" height="14" rx="3"/>
<text class="mutex-label" x="204" y="867" fill="var(--text-main)" font-weight="400">外部ライブラリ/OS</text>

<rect class="actor-box-mem" x="340" y="855" width="18" height="14" rx="3"/>
<text class="mutex-label" x="364" y="867" fill="var(--text-main)" font-weight="400">共有データ</text>

<rect class="self-tick" x="20" y="890" width="18" height="14" rx="3"/>
<text class="mutex-label" x="44" y="902" fill="var(--text-main)" font-weight="400">システム処理</text>

<rect class="self-tick-net" x="180" y="890" width="18" height="14" rx="3"/>
<text class="mutex-label" x="204" y="902" fill="var(--text-main)" font-weight="400">FTP探索処理</text>

<rect class="mutex-span" x="340" y="890" width="18" height="14" rx="3"/>
<text class="mutex-label" x="364" y="902">ロック区間</text>

</svg>
