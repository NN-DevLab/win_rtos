<svg viewBox="0 0 440 120" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="1" y="1" width="438" height="118" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="14" y="22" font-size="13" font-weight="bold" fill="#333333">編集ツールバー(ミニダイアログ)</text>

  <rect x="20" y="35" width="60" height="60" fill="#eef2ff" stroke="#333333" stroke-width="1.5"/>
  <text x="50" y="70" font-size="11" fill="#333333" text-anchor="middle">移動</text>

  <rect x="90" y="35" width="60" height="60" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="120" y="70" font-size="11" fill="#aaaaaa" text-anchor="middle">落書き</text>

  <rect x="160" y="35" width="60" height="60" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="190" y="65" font-size="11" fill="#aaaaaa" text-anchor="middle">フレーム</text>
  <text x="190" y="79" font-size="11" fill="#aaaaaa" text-anchor="middle">挿入</text>

  <rect x="230" y="35" width="60" height="60" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1"/>
