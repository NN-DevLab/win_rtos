  <text x="260" y="79" font-size="11" fill="#aaaaaa" text-anchor="middle">縮小</text>

  <rect x="300" y="35" width="60" height="60" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="330" y="70" font-size="11" fill="#aaaaaa" text-anchor="middle">回転</text>

  <rect x="370" y="35" width="60" height="60" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1"/>
  <text x="400" y="65" font-size="11" fill="#aaaaaa" text-anchor="middle">テキスト</text>
  <text x="400" y="79" font-size="11" fill="#aaaaaa" text-anchor="middle">追加</text>
